[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-ofm-agent"
version = "1.0.0"
description = "Autonomous AI OFM Agency Agent (6-Layer Architecture: Central Brain, 6-Chapter Overnight Closer, Model Factory, Social/Phone Farm Matrix & KPI Gatekeeper)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
ofm = "ofm_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
