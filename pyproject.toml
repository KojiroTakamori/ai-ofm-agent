[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-ofm-agent"
version = "1.1.0"
description = "Autonomous AI OFM Agency Agent (7-Layer Architecture & 6-Agent Council: Central Brain, Overnight Closer, Model Factory, Visual Pipeline, Social/Phone Farm Matrix, KPI Gatekeeper & Legal Guardian)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
ofm = "ofm_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
